services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      PORT: "4000"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      AI_GATEWAY_URL: "${AI_GATEWAY_URL:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      AI_GATEWAY_MODEL: "${AI_GATEWAY_MODEL:-gemini-flash-latest}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/auth/google/callback}"
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  uploads:
